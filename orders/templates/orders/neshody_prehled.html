{% extends "orders/base.html" %}

{% block title %}Přehled neshod{% endblock %}

{% block extra_head %}
    {{ block.super }}
    <meta http-equiv="refresh" content="60">
    <style>
        .nonconformity-row { color: inherit; transition: background-color .15s ease-in-out; }
        .nonconformity-row:hover, .nonconformity-row:focus { background-color: #fff3f3; color: inherit; }
        .nonconformity-table-head { background-color: #f8f9fa; }
        .nonconformity-day { background-color: var(--bs-secondary-bg, #e9ecef); }
        .nonconformity-day:not(:first-of-type) { border-top: 2px solid var(--bs-secondary-color, #6c757d); }
        @media (max-width: 767.98px) {
            .nonconformity-table-head { display: none; }
        }
    </style>
{% endblock %}

{% block content %}
{% include "orders/partials/neshody_prehled_content.html" %}
{% endblock %}
